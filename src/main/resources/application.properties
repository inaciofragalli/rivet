spring.config.import=optional:file:./.env[.properties]

spring.application.name=rivet

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

rivet.images.storage-dir=${RIVET_IMAGE_STORAGE_DIR}
rivet.cors.allowed-origin=${RIVET_CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=520MB

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${RIVET_SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=30m